<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CollabNotes - Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="editor-header">
    <h2 id="roomTitle">Loading...</h2>
    <div class="active-users" id="activeUsers"></div>
    <button onclick="goBack()" style="width:auto;padding:0.4rem 1rem;margin:0;font-size:0.85rem;">Back</button>
  </div>

  <div class="editor-body">
    <textarea id="noteEditor" placeholder="Start typing your note..."></textarea>
    <div class="editor-footer">
      <button onclick="saveNote()" style="background:#16a34a;">Save</button>
      <span id="saveStatus">Last saved: never</span>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const token = localStorage.getItem('token');
    const roomId = localStorage.getItem('currentRoomId');
    const roomName = localStorage.getItem('currentRoomName');
    let socket;

    if (!token || !roomId) window.location.href = 'index.html';

    document.getElementById('roomTitle').textContent = roomName || 'Untitled room';

    const editor = document.getElementById('noteEditor');

    async function startEditor() {
      try {
        await loadScript(socketScriptUrl());
      } catch (err) {
        document.getElementById('saveStatus').textContent = 'Could not load realtime client.';
        return;
      }

      socket = io(socketBaseUrl(), { auth: { token } });

      socket.emit('join-room', { roomId });

      socket.on('load-note', (content) => {
        editor.value = content || '';
      });

      socket.on('active-users', (users) => {
        document.getElementById('activeUsers').innerHTML =
          users.map(u => `<span class="user-badge">${escapeHtml(u)}</span>`).join('');
      });

      socket.on('receive-changes', (content) => {
        editor.value = content;
      });

      socket.on('note-saved', ({ savedBy, time }) => {
        document.getElementById('saveStatus').textContent =
          `Saved by ${savedBy} at ${time}`;
      });

      socket.on('connect_error', () => {
        document.getElementById('saveStatus').textContent = 'Realtime connection failed.';
      });
    }

    let typingTimer;
    editor.addEventListener('input', () => {
      if (!socket) return;

      socket.emit('typing', { roomId, content: editor.value });

      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => saveNote(), 3000);
    });

    function saveNote() {
      if (!socket) return;
      socket.emit('save-note', { roomId, content: editor.value });
    }

    function goBack() {
      if (socket) {
        socket.emit('leave-room', { roomId });
      }
      window.location.href = 'dashboard.html';
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    startEditor();
  </script>
</body>
</html>
